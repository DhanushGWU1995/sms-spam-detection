project_name: ScamShield US
s3_uri: s3://dats-nlp/dhanush.mathivanan@gwu.edu/nlp-data/
seed: 42

models:
  # All choices are free / open-source Hugging Face models
  embedding: sentence-transformers/all-MiniLM-L6-v2
  classifier: distilbert-base-uncased
  llm: Qwen/Qwen2.5-1.5B-Instruct
  llm_fallback_note: "Optional upgrade on A10G: Qwen/Qwen2.5-7B-Instruct with 4-bit quantization"
  reranker: cross-encoder/ms-marco-MiniLM-L-6-v2

classification:
  labels:
    - legitimate
    - phishing_spoofing
    - government_impersonation
    - banking_impersonation
    - investment_scam
    - identity_theft_attempt
    - other_uncertain
  primary_metric: macro_f1
  thresholds_tuned_on: validation
  weak_confidence:
    # DistilBERT is weak when (P(top1) - P(top2)) <= margin.
    # evaluate_approaches.py chooses the best margin on validation.
    margins_searched: [0.05, 0.10, 0.15, 0.20, 0.30]
    default_margin: 0.15
  comparison_approaches:
    - Traditional NLP
    - Advanced NLP
    - Hybrid NLP
    - LLM only
    - Hybrid + LLM

rag:
  chunk_size: 700
  chunk_overlap: 120
  top_k_bm25: 8
  top_k_dense: 8
  top_k_hybrid: 6
  hybrid_alpha: 0.55

llm:
  max_new_tokens: 320
  temperature: 0.1
  do_sample: false

# All of these are relative keys under s3_uri. EC2 keeps only an ephemeral cache.
paths:
  data_raw: data/raw
  data_processed: data/processed
  knowledge: data/knowledge
  provenance: data/provenance
  models: artifacts/models
  indexes: artifacts/indexes
  metrics: artifacts/metrics
  viz: artifacts/viz
  sqlite: artifacts/scamshield.db

